<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pablo · AI Solutions Architect · talk to my avatar</title>
<meta name="description" content="Talk to Pablo's AI avatar. AI Solutions Architect: Senior Solutions Architect at the Ethereum Foundation, founder of StreamETH and Scout.">
<meta property="og:title" content="Pablo · AI Solutions Architect">
<meta property="og:description" content="Skip the CV. Ask my AI avatar anything about my work.">
<meta name="theme-color" content="#08080c">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#08080c;--card:#13131a;--line:rgba(255,255,255,.09);--line-2:rgba(255,255,255,.16);--text:#f3f3f6;--text-2:#a3a3b2;--text-3:#6c6c7e;--violet:#a78bfa;--blue:#60a5fa;--green:#34d399;--sans:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',monospace}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 50% at 50% 35%,rgba(124,58,237,.18),transparent 70%),radial-gradient(ellipse 40% 40% at 70% 80%,rgba(96,165,250,.08),transparent 70%);pointer-events:none}
a{color:inherit;text-decoration:none}
.app{position:relative;height:100dvh;display:grid;grid-template-rows:auto 1fr auto;max-width:900px;margin:0 auto;padding:0 20px}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 0}
.who{font-family:var(--mono);font-size:13px}.who b{color:var(--violet);font-weight:500}
.top{display:flex;gap:8px;align-items:center}
.pill{font-size:13px;color:var(--text-2);border:1px solid var(--line-2);border-radius:999px;padding:6px 13px;background:rgba(19,19,26,.6);cursor:pointer;font-family:inherit;transition:.2s}
.pill:hover{color:var(--text);border-color:rgba(255,255,255,.3)}
.pill.on{color:var(--green);border-color:rgba(52,211,153,.4)}
.status{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;color:var(--green)}
.status i{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}

.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;gap:22px;padding-bottom:10px}
.frame{position:relative;width:min(300px,46vh);aspect-ratio:3/4;border-radius:28px;overflow:hidden;border:1px solid var(--line-2);background:radial-gradient(circle at 50% 35%,#1d1830,#0d0d14);box-shadow:0 30px 80px rgba(0,0,0,.5),0 0 0 6px rgba(167,139,250,.04);flex-shrink:1;min-height:150px}
.frame video,.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .35s}
.frame .hidden{opacity:0}
.frame::after{content:'';position:absolute;inset:0;border-radius:28px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);pointer-events:none}
.frame.talking{box-shadow:0 30px 80px rgba(0,0,0,.5),0 0 0 6px rgba(167,139,250,.12),0 0 60px rgba(167,139,250,.25)}
/* placeholder orb until the real avatar video exists */
.orb{position:absolute;left:50%;top:50%;width:58%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#c4b5fd,#7c3aed 45%,#1e3a8a);box-shadow:0 0 50px rgba(167,139,250,.4);display:grid;place-items:center}
.orb .eyes{display:flex;gap:26%;width:100%;justify-content:center;margin-top:-8%}
.orb .eyes i{width:9%;aspect-ratio:.7;border-radius:6px;background:#fff;animation:blink 4.5s infinite}
.orb .mouth{position:absolute;bottom:28%;left:50%;width:20%;height:5%;transform:translateX(-50%);border-radius:0 0 14px 14px;background:rgba(255,255,255,.85)}
.frame.talking .orb{animation:pulse 1.1s ease-in-out infinite}.frame.talking .orb .mouth{animation:talk .26s ease-in-out infinite alternate}
.frame.thinking .orb{animation:spin 2.2s linear infinite;background:conic-gradient(#7c3aed,#60a5fa,#a78bfa,#7c3aed)}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.05)}}
@keyframes talk{to{height:11%}}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.play{position:absolute;inset:auto 12px 12px 12px;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;border-radius:14px;background:rgba(8,8,12,.7);backdrop-filter:blur(8px);border:1px solid var(--line-2);font-size:14px;font-weight:500;cursor:pointer;color:var(--text);font-family:inherit}
.intro h1{font-size:clamp(24px,3.6vw,34px);letter-spacing:-.03em;font-weight:700;text-align:center;line-height:1.15}
.intro h1 span{background:linear-gradient(120deg,var(--violet),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.intro p{color:var(--text-2);text-align:center;margin-top:8px;font-size:15px}
.say{width:100%;max-width:680px;min-height:0;max-height:26vh;overflow-y:auto;text-align:center;font-size:clamp(16px,2vw,19px);line-height:1.55;color:var(--text);white-space:pre-wrap;scrollbar-width:thin}
.say .q{display:block;font-size:13px;color:var(--text-3);font-family:var(--mono);margin-bottom:8px}
.say.err{color:#fca5a5}

.dock{padding:8px 0 max(18px,env(safe-area-inset-bottom))}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px}
.chips button{font-family:inherit;font-size:13px;color:var(--text-2);background:rgba(19,19,26,.7);border:1px solid var(--line-2);border-radius:999px;padding:8px 14px;cursor:pointer;transition:.2s}
.chips button:hover{color:var(--text);border-color:rgba(255,255,255,.3)}
form{display:flex;gap:8px;background:rgba(19,19,26,.85);backdrop-filter:blur(10px);border:1px solid var(--line-2);border-radius:16px;padding:7px}
form:focus-within{border-color:rgba(167,139,250,.55)}
input{flex:1;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:16px;padding:10px 12px;min-width:0}
input::placeholder{color:var(--text-3)}
.mic,.send{border:0;border-radius:11px;cursor:pointer;font:inherit;display:grid;place-items:center}
.mic{width:44px;background:none;color:var(--text-2)}.mic:hover{color:var(--text)}.mic.rec{color:#f87171;animation:pulse2 1s infinite}
@keyframes pulse2{50%{opacity:.5}}
.mic svg{width:20px;height:20px}
.send{background:var(--text);color:#08080c;padding:0 18px;font-weight:600}
.send:disabled{opacity:.35;cursor:default}
.links{display:flex;justify-content:center;gap:18px;margin-top:12px;font-size:12px;color:var(--text-3);font-family:var(--mono)}
.links a:hover{color:var(--text)}
@media (max-width:560px){.status{display:none}.chips button:nth-child(n+3){display:none}.frame{width:min(220px,36vh);border-radius:22px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="who">pblvrt<b>.</b> &nbsp;<span class="status"><i></i>open to AI Solutions Architect roles</span></div>
    <div class="top"><button class="pill on" id="voice" type="button">🔊 Voice</button></div>
  </header>

  <main class="stage">
    <div class="frame" id="frame">
      <div class="orb" id="orb"><div class="eyes"><i></i><i></i></div><div class="mouth"></div></div>
      <img id="still" class="hidden" alt="Pablo">
      <video id="idle" class="hidden" muted loop playsinline preload="auto"></video>
      <video id="talk" class="hidden" muted loop playsinline preload="auto"></video>
      <video id="intro" class="hidden" playsinline preload="auto"></video>
      <button class="play" id="play" type="button" hidden>▶ Say hi</button>
    </div>
    <div class="intro" id="intro-text">
      <h1>Hi, I'm Pablo's <span>AI avatar</span>.</h1>
      <p>Ask me anything about his work, the way you'd ask in an interview.</p>
    </div>
    <div class="say" id="say" hidden></div>
  </main>

  <div class="dock">
    <div class="chips" id="chips">
      <button>Why is Pablo a fit for an AI Solutions Architect role?</button>
      <button>What did he do at the Ethereum Foundation?</button>
      <button>How does Scout work?</button>
      <button>How does he approach a new client problem?</button>
    </div>
    <form id="f">
      <button class="mic" id="mic" type="button" title="Ask out loud" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <input id="q" maxlength="1000" placeholder="Ask about Pablo's experience, projects, how he works…" autocomplete="off">
      <button class="send" id="send">Ask</button>
    </form>
    <div class="links"><a href="/work.html">Classic CV view</a><a href="https://github.com/pblvrt" target="_blank" rel="noopener">GitHub</a><a href="https://x.com/pblvrt" target="_blank" rel="noopener">X</a></div>
  </div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const frame=$('frame'),orb=$('orb'),still=$('still'),idle=$('idle'),talk=$('talk'),intro=$('intro'),play=$('play'),say=$('say'),introText=$('intro-text'),chips=$('chips'),f=$('f'),q=$('q'),send=$('send'),vbtn=$('voice'),mic=$('mic');
const history=[];let voice=true,busy=false,hasVideo=false,audio=null;

// Real avatar media, if present: /avatar/still.jpg, idle.mp4 (silent loop), talk.mp4 (silent talking loop), intro.mp4 (with sound)
fetch('/avatar/manifest.json').then(r=>r.ok?r.json():null).then(m=>{
  if(!m)return;
  if(m.still){still.src=m.still;still.onload=()=>{still.classList.remove('hidden');orb.style.display='none'}}
  if(m.idle){idle.src=m.idle;idle.oncanplay=()=>{hasVideo=true;idle.classList.remove('hidden');orb.style.display='none';idle.play().catch(()=>{})}}
  if(m.talk)talk.src=m.talk;
  if(m.intro){intro.src=m.intro;play.hidden=false}
}).catch(()=>{});

function setTalking(on){
  frame.classList.toggle('talking',on);
  if(hasVideo&&talk.src){talk.classList.toggle('hidden',!on);if(on){talk.currentTime=0;talk.play().catch(()=>{})}else talk.pause()}
}
play.onclick=()=>{play.hidden=true;intro.classList.remove('hidden');intro.muted=false;intro.currentTime=0;intro.play();frame.classList.add('talking')};
intro.onended=()=>{intro.classList.add('hidden');frame.classList.remove('talking')};

vbtn.onclick=()=>{voice=!voice;vbtn.classList.toggle('on',voice);vbtn.textContent=voice?'🔊 Voice':'🔇 Muted';if(!voice)stopSpeech()};
const synth=window.speechSynthesis;
function stopSpeech(){if(audio){audio.pause();audio=null}if(synth)synth.cancel();setTalking(false)}
function pickVoice(){const vs=synth.getVoices();return vs.find(v=>/en-GB/.test(v.lang)&&/Daniel|Arthur|UK English Male/i.test(v.name))||vs.find(v=>/^en/.test(v.lang)&&/Natural|Google|Daniel|Alex/i.test(v.name))||vs.find(v=>/^en/.test(v.lang))}
async function speak(t){
  if(!voice)return;stopSpeech();
  // Prefer the server voice (cloned voice) when configured; fall back to the browser voice.
  try{
    const r=await fetch('/api/tts',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text:t})});
    if(r.ok){const b=await r.blob();audio=new Audio(URL.createObjectURL(b));audio.onplay=()=>setTalking(true);audio.onended=audio.onerror=()=>setTalking(false);await audio.play();return}
  }catch{}
  if(!synth)return;const u=new SpeechSynthesisUtterance(t);const v=pickVoice();if(v)u.voice=v;u.rate=1.03;u.onstart=()=>setTalking(true);u.onend=u.onerror=()=>setTalking(false);synth.speak(u);
}
async function ask(text){
  text=text.trim();if(busy||!text)return;busy=true;send.disabled=true;stopSpeech();
  if(!intro.paused){intro.pause();intro.classList.add('hidden')}
  introText.hidden=true;chips.style.display='none';say.hidden=false;say.classList.remove('err');
  say.innerHTML='';const qd=document.createElement('span');qd.className='q';qd.textContent='“'+text+'”';const ad=document.createElement('span');ad.textContent='…';say.append(qd,ad);
  history.push({role:'user',content:text});q.value='';frame.classList.add('thinking');let out='';
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({messages:history})});
    if(!r.ok){let m='Something went wrong. Try again in a moment.';try{m=(await r.json()).error||m}catch{}throw new Error(m)}
    const rd=r.body.getReader(),dec=new TextDecoder();frame.classList.remove('thinking');
    if(!voice)setTalking(true);
    for(;;){const {done,value}=await rd.read();if(done)break;out+=dec.decode(value,{stream:true});ad.textContent=out;say.scrollTop=say.scrollHeight}
    history.push({role:'assistant',content:out});
    if(voice)speak(out);else setTimeout(()=>setTalking(false),400);
  }catch(e){ad.textContent=e.message;say.classList.add('err');history.pop()}
  finally{frame.classList.remove('thinking');busy=false;send.disabled=false;q.focus()}
}
f.onsubmit=e=>{e.preventDefault();ask(q.value)};
chips.querySelectorAll('button').forEach(b=>b.onclick=()=>ask(b.textContent));

// Ask out loud (where the browser supports speech recognition)
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){mic.hidden=false;let rec=null;mic.onclick=()=>{
  if(rec){rec.stop();return}
  rec=new SR();rec.lang='en-US';rec.interimResults=true;mic.classList.add('rec');stopSpeech();
  rec.onresult=e=>{q.value=[...e.results].map(r=>r[0].transcript).join('');if(e.results[e.results.length-1].isFinal)ask(q.value)};
  rec.onend=rec.onerror=()=>{mic.classList.remove('rec');rec=null};rec.start();
}}
})();
</script>
</body>
</html>
